components:
  schemas:
    BoundaryFeature:
      properties:
        type:
          type: string
          const: Feature
          title: Type
        properties:
          $ref: '#/components/schemas/BoundaryProperties'
        geometry:
          anyOf:
          - $ref: '#/components/schemas/PolygonGeometry'
          - $ref: '#/components/schemas/MultiPolygonGeometry'
          title: Geometry
      type: object
      required:
      - type
      - properties
      - geometry
      title: BoundaryFeature
    BoundaryProperties:
      properties:
        state_id:
          type: string
          title: State Id
        name:
          type: string
          title: Name
      type: object
      required:
      - state_id
      - name
      title: BoundaryProperties
    Capabilities:
      properties:
        available_datasets:
          items:
            type: string
          type: array
          title: Available Datasets
        comparison_metrics:
          items:
            type: string
          type: array
          title: Comparison Metrics
        rainfall_observation_dates:
          items:
            type: string
          type: array
          title: Rainfall Observation Dates
        available_years:
          additionalProperties:
            items:
              type: integer
            type: array
          type: object
          title: Available Years
        available_hazards:
          items:
            type: string
          type: array
          title: Available Hazards
        observed_replay:
          items:
            type: string
          type: array
          title: Observed Replay
        boundaries:
          type: boolean
          title: Boundaries
          default: false
        omitted_datasets:
          additionalProperties:
            type: string
          type: object
          title: Omitted Datasets
      type: object
      title: Capabilities
    Catalog:
      properties:
        processed_at:
          type: string
          title: Processed At
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        datasets:
          additionalProperties:
            $ref: '#/components/schemas/Metadata'
          type: object
          title: Datasets
      type: object
      required:
      - processed_at
      - capabilities
      - datasets
      title: Catalog
    ComparisonPoint:
      properties:
        year:
          type: integer
          maximum: 2100.0
          minimum: 1800.0
          title: Year
        state_a:
          anyOf:
          - type: number
          - type: 'null'
          title: State A
        state_b:
          anyOf:
          - type: number
          - type: 'null'
          title: State B
        absolute_difference:
          anyOf:
          - type: number
          - type: 'null'
          title: Absolute Difference
        percentage_difference:
          anyOf:
          - type: number
          - type: 'null'
          title: Percentage Difference
      additionalProperties: false
      type: object
      required:
      - year
      - state_a
      - state_b
      title: ComparisonPoint
      description: Plugin-supplied differences; percentage baseline is state_a, never
        zero.
    ComparisonResult:
      properties:
        state_a:
          type: string
          minLength: 1
          title: State A
        state_b:
          type: string
          minLength: 1
          title: State B
        metric:
          type: string
          minLength: 1
          title: Metric
        unit:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit
        period:
          $ref: '#/components/schemas/Period'
        series:
          items:
            $ref: '#/components/schemas/ComparisonPoint'
          type: array
          minItems: 1
          title: Series
        state_a_value:
          anyOf:
          - type: number
          - type: 'null'
          title: State A Value
        state_b_value:
          anyOf:
          - type: number
          - type: 'null'
